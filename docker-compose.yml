services:
  # =====================================================
  # 1. DATABASE (PostgreSQL - Multi-Tenant Auto-Init)
  # =====================================================
  postgres:
    image: postgres:16-alpine
    container_name: smartcampus-postgres
    restart: unless-stopped
    command: "postgres -c max_connections=300"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collegeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collegepass}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    expose:
      - "5432"
    volumes:
      - ./backend/docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collegeuser} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - smartcampus-network

  # =====================================================
  # 2. SERVICE DISCOVERY & REGISTRY
  # =====================================================
  eureka-server:
    build:
      context: ./backend/eureka-server
    image: smartcampus-eureka:latest
    container_name: smartcampus-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      - PORT=8761
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smartcampus-network

  # =====================================================
  # 3. API GATEWAY
  # =====================================================
  api-gateway:
    build:
      context: ./backend/api-gateway
    image: smartcampus-gateway:latest
    container_name: smartcampus-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - smartcampus-network

  # =====================================================
  # 4. FRONTEND WEB APPLICATION (React + Vite + Nginx)
  # =====================================================
  frontend:
    build:
      context: ./frontend
    image: smartcampus-frontend:latest
    container_name: smartcampus-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - smartcampus-network

  # =====================================================
  # 5. CORE BUSINESS MICROSERVICES
  # =====================================================
  auth-service:
    build:
      context: ./backend/auth-service
    image: smartcampus-auth:latest
    container_name: smartcampus-auth
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      - PORT=8090
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DB_USERNAME=${POSTGRES_USER:-collegeuser}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-collegepass}
      - JWT_SECRET=${JWT_SECRET:-SmartCampus-Super-Secret-Key-2026-Min-32-Chars-OK}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - smartcampus-network

  college-service:
