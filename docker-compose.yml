  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartcampus-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartcampus.edu
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
