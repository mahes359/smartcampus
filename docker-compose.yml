services:
  # =====================================================
  # 1. DATABASE (PostgreSQL - Multi-Tenant Auto-Init)
  # =====================================================
  postgres-db:
    image: postgres:16-alpine
    container_name: smartcampus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./backend/docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartcampus-network

  # =====================================================
  # 2. SERVICE DISCOVERY & REGISTRY
  # =====================================================
  eureka-server:
    build:
      context: ./backend/eureka-server
    container_name: smartcampus-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      - PORT=8761
    networks:
      - smartcampus-network
    profiles:
      - core
      - all

  # =====================================================
  # 3. API GATEWAY
  # =====================================================
  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: smartcampus-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - smartcampus-network
    profiles:
      - core
      - all

  # =====================================================
  # 4. CORE SERVICES (Auth & College Multi-Tenant)
  # =====================================================
  auth-service:
    build:
      context: ./backend/auth-service
    container_name: smartcampus-auth
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - DB_HOST=postgres-db
      - POSTGRES_HOST=postgres-db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      postgres-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - smartcampus-network
    profiles:
      - core
      - all

  college-service:
    build:
      context: ./backend/college-service
    container_name: smartcampus-college
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      - PORT=8091
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - DB_HOST=postgres-db
      - POSTGRES_HOST=postgres-db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      postgres-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - smartcampus-network
    profiles:
      - core
      - all

  # =====================================================
  # 5. FRONTEND WEB APPLICATION (React + Vite + Nginx)
  # =====================================================
  frontend:
    build:
      context: ./frontend
    container_name: smartcampus-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - smartcampus-network
    profiles:
      - core
      - all

  # =====================================================
