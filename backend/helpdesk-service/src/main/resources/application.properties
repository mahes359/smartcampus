spring.application.name=helpdesk-service

server.port=${PORT:8108}

# =====================================================
# Database - PostgreSQL
# =====================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/college_helpdesk}
spring.datasource.username=${DB_USERNAME:collegeuser}
spring.datasource.password=${DB_PASSWORD:collegepass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =====================================================
# Eureka
# =====================================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always