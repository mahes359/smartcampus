<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Service GUI - College Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #8b5cf6;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            background-attachment: fixed;
            background-size: cover;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .icon-container {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .icon-container svg { width: 30px; height: 30px; color: white; }
        
        h1 { font-size: 2.5rem; font-weight: 700; background: linear-gradient(to right, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: #94a3b8; font-size: 1.1rem; }

        .layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 { font-size: 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; color: white; }

        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #cbd5e1; }
        input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; border: none; padding: 0.8rem 1.5rem; font-size: 1rem; font-weight: 600;
            border-radius: 8px; cursor: pointer; transition: all 0.3s ease; width: 100%;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4); }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        td { color: #f8fafc; font-size: 0.95rem; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }

        .notification {
            position: fixed; top: 20px; right: 20px; padding: 1rem 1.5rem; border-radius: 8px;
            background: var(--card-bg); border: 1px solid var(--border); color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateX(120%); transition: all 0.3s ease;
            z-index: 1000;
        }
        .notification.show { transform: translateX(0); }
        .notification.success { border-left: 4px solid var(--success); }
        .notification.error { border-left: 4px solid var(--danger); }

        .loading { display: none; margin: 2rem auto; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .empty-state { text-align: center; padding: 3rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div id="notification" class="notification"></div>

    <div class="container">
        <header>
            <div class="icon-container">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
            </div>
            <div>
                <h1>Attendance Service</h1>
                <p class="subtitle">Management Dashboard Endpoint</p>
            </div>
        </header>

        <div class="layout">
            <div class="glass-card">
                <h2>Add Attendance</h2>
                <form id="createForm">
                    <div id="formFields"></div>
                    <button type="submit" class="btn" id="submitBtn">Save Attendance</button>
                </form>
            </div>

            <div class="glass-card" style="overflow-x: auto;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2 style="margin-bottom: 0; border: none;">Attendance Directory</h2>
                    <button class="btn" style="width: auto; padding: 0.5rem 1rem;" onclick="loadData()">Refresh</button>
                </div>
                
                <div id="loading" class="loading"></div>
                
                <table id="dataTable" style="display: none;">
                    <thead>
                        <tr id="tableHeadRow">
                            <th>ID</th>
                            <!-- Dynamic headers -->
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div id="emptyState" class="empty-state" style="display: none;">
                    No records found.
                </div>
            </div>
        </div>
    </div>

            <script>
        const CFG = {
            ns: "http://college.com/attendance",
            entityName: "Attendance",
            entityCamel: "attendance",
            pluralCamel: "attendance",
            getAllRequest: "getAllAttendanceRequest",
            fields: [
                {name: "attendanceCode", label: "Attendance Code", type: "text"},
                {name: "studentId", label: "Student", type: "select", sourceService: "student", sourceNs: "http://college.com/student", sourceReq: "getAllStudentsRequest", sourceTags: ["student", "students"], sourceId: "id", sourceLabel: ["firstName", "lastName"]},
                {name: "courseId", label: "Course", type: "select", sourceService: "course", sourceNs: "http://college.com/course", sourceReq: "getAllCoursesRequest", sourceTags: ["course", "courses"], sourceId: "id", sourceLabel: ["courseName"]},
                {name: "attendanceDate", label: "Date (YYYY-MM-DD)", type: "date"},
                {name: "status", label: "Status (Present/Absent)", type: "text"}
            ]
        };
        document.addEventListener('DOMContentLoaded', () => {
            renderForm();
            renderTableHeaders();
            loadData();
        });

        async function fetchOptions(service, reqName, ns, extractArray, extractId, extractLabel) {
            const envelope = `<?xml version="1.0" encoding="utf-8"?>
<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:tns="${ns}">
   <soapenv:Header/>
   <soapenv:Body><tns:${reqName}/></soapenv:Body>
</soapenv:Envelope>`;
            try {
                // Dynamic API Gateway URL: Render Cloud vs Azure VM / Localhost
                const isRender = window.location.hostname.includes('onrender.com');
                const GATEWAY_URL = isRender 
                    ? "https://api-gateway-wzqo.onrender.com" 
                    : `${window.location.protocol}//${window.location.hostname}:8080`;
                const url = `${GATEWAY_URL}/${service}/ws`;

                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/xml' }, body: envelope });

                if (!response.ok) {
                    let faultDetail = '';
                    try {
                        const errText = await response.text();
                        const errXml = new DOMParser().parseFromString(errText, 'text/xml');
                        const faultStrings = errXml.getElementsByTagName('faultstring');
                        if (faultStrings.length > 0) {
                            faultDetail = ' — ' + faultStrings[0].textContent;
                        }
                    } catch (_) {}
                    const errMsg = `[fetchOptions] HTTP ${response.status} from ${url}${faultDetail}`;
                    console.error(errMsg);
                    return { fetchError: true, label: `${service}` };
                }

                const text = await response.text();
                const xml = new DOMParser().parseFromString(text, 'text/xml');
                let nodes = [];
                const allElements = xml.getElementsByTagName('*');
                for (let i = 0; i < allElements.length; i++) {
                    if (extractArray.includes(allElements[i].localName) && !allElements[i].localName.includes('Response')) {
                        nodes.push(allElements[i]);
                    }
                }
                return nodes.map(node => {
                    const getText = (tag) => {
                        for (let i = 0; i < node.childNodes.length; i++) {
                            if (node.childNodes[i].nodeType === 1 && node.childNodes[i].localName === tag) return node.childNodes[i].textContent;
                        }
                        return '';
                    };
                    return { id: getText(extractId), label: extractLabel.map(l => getText(l)).filter(v => v).join(' — ') };
                });
            } catch(e) {
                console.error(`[fetchOptions] Network error fetching /${service}/ws:`, e);
                return { fetchError: true, label: `${service}` };
            }
        }

        async function renderForm() {
            const container = document.getElementById('formFields');
            container.innerHTML = ''; // Clear existing
            for (let f of CFG.fields) {
                const group = document.createElement('div');
                group.className = 'form-group';

                if (f.type === 'select') {
                    group.innerHTML = `
                        <label for="${f.name}">${f.label}</label>
                        <select id="${f.name}" name="${f.name}" required style="width: 100%; padding: 0.8rem 1rem; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: white; outline: none; appearance: auto;">
                            <option value="">Loading...</option>
                        </select>
                    `;
                    container.appendChild(group);

                    fetchOptions(f.sourceService, f.sourceReq, f.sourceNs, f.sourceTags, f.sourceId, f.sourceLabel).then(result => {
                        const select = document.getElementById(f.name);
                        if (!select) return;
                        if (result && result.fetchError) {
                            select.innerHTML = `<option value="">⚠ Failed to load ${f.label}</option>`;
                            select.style.borderColor = '#ef4444';
                            return;
                        }
                        const options = Array.isArray(result) ? result : [];
                        if (options.length === 0) {
                            select.innerHTML = `<option value="">No data found</option>`;
                        } else {
                            select.innerHTML = `<option value="">Select ${f.label}</option>`;
                            options.forEach(opt => {
                                select.innerHTML += `<option value="${opt.id}">${opt.label}</option>`;
                            });
                        }
                    });
                } else {
                    let inputType = f.type;
                    let stepHtml = inputType === 'number' ? ' step="any"' : '';
                    group.innerHTML = `
                        <label for="${f.name}">${f.label}</label>
                        <input type="${inputType}" id="${f.name}" name="${f.name}" required${stepHtml}>
                    `;
                    container.appendChild(group);
                }
            }
            
            // Unbind existing listener to prevent duplicates
            const form = document.getElementById('createForm');
            const newForm = form.cloneNode(true);
            form.parentNode.replaceChild(newForm, form);
            
            document.getElementById('createForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                btn.disabled = true;
                btn.innerText = 'Saving...';
                
                const formData = {};
                CFG.fields.forEach(f => {
                    formData[f.name] = document.getElementById(f.name).value;
                });
                
                await createRecord(formData);
                
                btn.disabled = false;
                btn.innerText = `Save ${CFG.entityName}`;
            });
        }

        function renderTableHeaders() {
            const tr = document.getElementById('tableHeadRow');
            const actionsTh = tr.lastElementChild;
            // Clear existing dynamic headers
            while(tr.children.length > 2) {
                tr.removeChild(tr.children[1]);
            }
            CFG.fields.forEach(f => {
                const th = document.createElement('th');
                th.innerText = f.label;
                tr.insertBefore(th, actionsTh);
            });
        }

        function showNotification(msg, type) {
            const n = document.getElementById('notification');
            n.innerText = msg;
            n.className = `notification show ${type}`;
            setTimeout(() => n.className = 'notification', 3000);
        }

        async function sendSoap(requestName, payload) {
            const envelope = `<?xml version="1.0" encoding="utf-8"?>
<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:tns="${CFG.ns}">
   <soapenv:Header/>
   <soapenv:Body>
      <tns:${requestName}>
         ${payload}
      </tns:${requestName}>
   </soapenv:Body>
</soapenv:Envelope>`;

            try {
                // Current service ws is always at relative /ws
                const wsUrl = '/ws';
                
                const response = await fetch(wsUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/xml' },
                    body: envelope
                });
                
                if (!response.ok) {
                    let errMsg = `HTTP Error: ${response.status}`;
                    try {
                        const text = await response.text();
                        const parser = new DOMParser();
                        const xml = parser.parseFromString(text, "text/xml");
                        const faultStrings = xml.getElementsByTagName('faultstring');
                        if (faultStrings.length > 0) {
                            errMsg = faultStrings[0].textContent;
                        }
                    } catch(e) {}
                    throw new Error(errMsg);
                }
                
                const text = await response.text();
                const parser = new DOMParser();
                return parser.parseFromString(text, "text/xml");
            } catch (error) {
                console.error("SOAP Error:", error);
                throw error;
            }
        }

        async function loadData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('dataTable').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
            
            try {
                const xml = await sendSoap(CFG.getAllRequest, '');
                
                let nodes = [];
                const allElements = xml.getElementsByTagName('*');
                for (let i = 0; i < allElements.length; i++) {
                    if (allElements[i].localName === CFG.pluralCamel || allElements[i].localName === CFG.entityCamel || allElements[i].localName === CFG.entityCamel + 's' || allElements[i].localName === 'faculties') {
                        if (!allElements[i].localName.includes('Response')) {
                            nodes.push(allElements[i]);
                        }
                    }
                }
                
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                if (nodes.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                } else {
                    nodes.forEach(node => {
                        const tr = document.createElement('tr');
                        
                        const getText = (tagName) => {
                            for (let i = 0; i < node.childNodes.length; i++) {
                                let child = node.childNodes[i];
                                if (child.nodeType === 1 && child.localName === tagName) return child.textContent;
                            }
                            return '';
                        };
                        
                        const id = getText('id') || 'N/A';
                        tr.innerHTML = `<td>${id}</td>`;
                        
                        CFG.fields.forEach(f => {
                            tr.innerHTML += `<td>${getText(f.name)}</td>`;
                        });
                        
                        const actionTd = document.createElement('td');
                        actionTd.innerHTML = `<button class="btn btn-danger" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; width: auto;" onclick="deleteRecord('${id}')">Delete</button>`;
                        tr.appendChild(actionTd);
                        
                        tbody.appendChild(tr);
                    });
                    document.getElementById('dataTable').style.display = 'table';
                }
            } catch (err) {
                showNotification(err.message || "Failed to load data", "error");
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function createRecord(data) {
            let payload = '';
            CFG.fields.forEach(f => {
                payload += `<tns:${f.name}>${data[f.name]}</tns:${f.name}>\n`;
            });
            
            try {
                await sendSoap(`create${CFG.entityName}Request`, payload);
                showNotification(`${CFG.entityName} created successfully!`, "success");
                document.getElementById('createForm').reset();
                loadData();
            } catch (err) {
                showNotification(err.message || "Failed to create record", "error");
            }
        }

        async function deleteRecord(id) {
            if (!confirm(`Are you sure you want to delete ID ${id}?`)) return;
            
            try {
                const idField = CFG.entityCamel + 'Id';
                const payload = `<tns:${idField}>${id}</tns:${idField}>`;
                
                await sendSoap(`delete${CFG.entityName}Request`, payload);
                showNotification(`${CFG.entityName} deleted successfully!`, "success");
                loadData();
            } catch (err) {
                showNotification(err.message || "Failed to delete record", "error");
            }
        }
    </script>
</body>
</html>
