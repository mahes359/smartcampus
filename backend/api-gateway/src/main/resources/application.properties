spring.application.name=api-gateway

server.port=${PORT:8080}

# =====================================================
# Eureka
# =====================================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =====================================================
# Gateway Configuration
# =====================================================
spring.cloud.gateway.server.webflux.enabled=true

# --- Core Services ---
# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# College Service
spring.cloud.gateway.server.webflux.routes[1].id=college-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://COLLEGE-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/colleges/**

# Student Service (REST)
spring.cloud.gateway.server.webflux.routes[2].id=student-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/students/**

# Faculty Service (REST)
