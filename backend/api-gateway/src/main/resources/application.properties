# --- Legacy & SOAP Endpoints Compatibility Routes ---
spring.cloud.gateway.server.webflux.routes[20].id=soap-student
spring.cloud.gateway.server.webflux.routes[20].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.server.webflux.routes[20].predicates[0]=Path=/student/ws/**
spring.cloud.gateway.server.webflux.routes[20].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[21].id=soap-faculty
spring.cloud.gateway.server.webflux.routes[21].uri=lb://FACULTY-SERVICE
spring.cloud.gateway.server.webflux.routes[21].predicates[0]=Path=/faculty/ws/**
spring.cloud.gateway.server.webflux.routes[21].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[22].id=soap-course
spring.cloud.gateway.server.webflux.routes[22].uri=lb://COURSE-SERVICE
spring.cloud.gateway.server.webflux.routes[22].predicates[0]=Path=/course/ws/**
