version: '3.8'

services:
  # =====================================================
  # DATABASE (Database-per-service pattern via PostgreSQL)
  # =====================================================
  postgres-db:
    image: postgres:16-alpine
    container_name: smartcampus-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartcampus-network

  # =====================================================
  # SERVICE DISCOVERY & REGISTRY
  # =====================================================
  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - PORT=8761
    networks:
      - smartcampus-network

  # =====================================================
  # API GATEWAY
  # =====================================================
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - smartcampus-network

  # =====================================================
  # CORE SERVICES
  # =====================================================
  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - POSTGRES_HOST=postgres-db
    depends_on:
      - eureka-server
      - postgres-db
    networks:
      - smartcampus-network

  college-service:
    build:
      context: ./college-service
    ports:
      - "8091:8091"
    environment:
      - PORT=8091
      - EUREKA_URL=http://eureka-server:8761/eureka/
