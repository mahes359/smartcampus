version: '3.8'

services:
  # =====================================================
  # DATABASE (Database-per-service pattern via PostgreSQL)
  # =====================================================
  postgres-db:
    image: postgres:16-alpine
    container_name: smartcampus-postgres
    environment:
      POSTGRES_USER: ${DB_MASTER_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_MASTER_PASSWORD:-postgres}
      POSTGRES_MAX_CONNECTIONS: "300"
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartcampus-network
    command: >
      postgres
        -c max_connections=300
        -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =====================================================
  # SERVICE DISCOVERY & REGISTRY
  # =====================================================
  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - PORT=8761
    networks:
      - smartcampus-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =====================================================
  # API GATEWAY
  # =====================================================
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - smartcampus-network

  # =====================================================
  # CORE SERVICES
  # =====================================================
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USERNAME=collegeuser
      - DB_PASSWORD=collegepass
      - JWT_SECRET=SmartCampus-Super-Secret-Key-2026-Min-32-Chars-OK
      - JWT_EXPIRATION_MS=86400000
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    networks:
      - smartcampus-network

