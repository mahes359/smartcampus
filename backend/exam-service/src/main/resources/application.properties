spring.application.name=exam-service
server.port=${PORT:8097}

# =====================================================
# PostgreSQL Database (Database-per-service pattern)
# =====================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/college_exam}
spring.datasource.username=${DB_USERNAME:collegeuser}
spring.datasource.password=${DB_PASSWORD:collegepass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# =====================================================
# JPA / Hibernate
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# Eureka Client
# =====================================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always