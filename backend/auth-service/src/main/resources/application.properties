spring.application.name=auth-service

server.port=${PORT:8090}

# =====================================================
# Database - PostgreSQL
# =====================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/college_auth}
spring.datasource.username=${DB_USERNAME:collegeuser}
spring.datasource.password=${DB_PASSWORD:collegepass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================================================
# Eureka
# =====================================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =====================================================
# JWT Configuration
# =====================================================
jwt.secret=${JWT_SECRET:SmartCampus-Super-Secret-Key-2026-Min-32-Chars-OK}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
